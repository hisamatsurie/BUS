<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>葛西方面 バス</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 16px 40px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f3f5f7;
      color: #222;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .subtitle {
      margin-bottom: 22px;
      color: #777;
      font-size: 14px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }

    .stop-name {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .route {
      color: #666;
      font-size: 15px;
      margin-bottom: 18px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 12px 10px;
      border-radius: 13px;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      text-align: center;
    }

    .btn-time {
      background: #287cf4;
      color: #fff;
    }

    .btn-approach {
      background: #eef4ff;
      color: #1765c1;
      border: 1px solid #cfe0fb;
    }

    .hint {
      margin-top: 22px;
      color: #999;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🚌 葛西方面 バス</h1>

  <div class="subtitle">
    バス停を選んで都バス公式ページを開きます
  </div>


  <!-- 江戸川車庫前 -->
  <div class="card">

    <div class="stop-name">
      江戸川車庫前
    </div>

    <div class="route">
      秋26　葛西駅前行
    </div>

    <div class="buttons">

      <a
        class="btn btn-time"
        href="https://tobus.jp/sp/blsys/stop/time?ud=2&poleno=2&ln=ja&stopid=310&routecode=81">
        🕒 時刻表
      </a>

      <a
        class="btn btn-approach"
        href="https://tobus.jp/blsys/navi?VCD=csrst&ECD=NEXT&LCD=&func=fap&method=msn&slst=310&slrsp=&srtxt=%E6%B1%9F%E6%88%B8%E5%B7%9D">
        📍 接近情報
      </a>

    </div>

  </div>


  <!-- 葛西郵便局 -->
  <div class="card">

    <div class="stop-name">
      葛西郵便局
    </div>

    <div class="route">
      葛西24　なぎさニュータウン行
    </div>

    <div class="buttons">

      <a
        class="btn btn-time"
        href="https://tobus.jp/sp/blsys/stop/time?ud=1&poleno=2&ln=ja&stopid=2084&routecode=76">
        🕒 時刻表
      </a>

      <a
        class="btn btn-approach"
        href="https://tobus.jp/blsys/navi?VCD=csrst&ECD=NEXT&LCD=&func=fap&method=msn&slst=2084&slrsp=&srtxt=%E8%91%9B%E8%A5%BF%E9%83%B5%E4%BE%BF">
        📍 接近情報
      </a>

    </div>

  </div>


  <div class="hint">
    時刻表・接近情報はいずれも都バス公式ページを開きます。
  </div>

</div>

</body>
</html>
