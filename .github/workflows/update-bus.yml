name: Update bus timetable

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch bus timetable
        run: python fetch_bus.py

      - name: Commit updated timetable
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bus_data.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update bus timetable"
            git push
          fi
